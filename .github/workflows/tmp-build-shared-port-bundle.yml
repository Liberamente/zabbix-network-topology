name: Temporary shared-port UI bundle build
on:
  push:
    paths:
      - '.github/workflows/tmp-build-shared-port-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    if: github.ref == 'refs/heads/feature/lldp-consolidated-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Compile frontend from locked dependencies
        run: |
          npm ci
          npm run build
          git diff --stat -- assets/js/dist/nt-bundle.js
      - name: Commit only generated frontend bundle
        run: |
          if git diff --quiet -- assets/js/dist/nt-bundle.js; then
            echo 'BUNDLE_ALREADY_CURRENT=YES'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- assets/js/dist/nt-bundle.js
            git commit -m 'build(ui): synchronize shared-port edge detail bundle'
            git push origin HEAD:feature/lldp-consolidated-20261110
          fi
