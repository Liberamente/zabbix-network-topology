name: isolated-zabbix70-lldp-import

# Runs against a disposable DB and loopback-only Docker network on GitHub's
# ephemeral runner. No Zabbix production secrets, proxies or customer data.
on:
  pull_request:
    paths:
      - .github/workflows/isolated-zabbix70-lldp-import.yml
      - tools/ci/nt-lldp-isolated.compose.yml
      - tools/ci/nt-lldp-zabbix70-import.mjs
      - tools/nt-lldp-raw-identity-check.mjs
      - templates/nt_lldp_snmp_template.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-lld:
    name: isolated Zabbix 7.0 import + synthetic LLD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate redacted local LLDP raw-walk comparator
        run: node tools/nt-lldp-raw-identity-check.mjs --self-test
      - name: Start ephemeral isolated Zabbix 7.0 stack
        run: docker compose -p nt-lldp-ci -f tools/ci/nt-lldp-isolated.compose.yml up -d
      - name: Verify template import, UUIDs and synthetic LLDP LLD item IDs
        run: node tools/ci/nt-lldp-zabbix70-import.mjs
      - name: Failure diagnostics (no item data or secrets)
        if: failure()
        run: |
          docker compose -p nt-lldp-ci -f tools/ci/nt-lldp-isolated.compose.yml ps
          docker compose -p nt-lldp-ci -f tools/ci/nt-lldp-isolated.compose.yml logs --tail=30 server web db
      - name: Destroy ephemeral containers, network and database volume
        if: always()
        run: docker compose -p nt-lldp-ci -f tools/ci/nt-lldp-isolated.compose.yml down -v --remove-orphans
