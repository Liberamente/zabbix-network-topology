zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates/Network devices
  templates:
    - uuid: 38caefc2777a4ea5a8e2f9a2060c0660
      template: 'NT LLDP Neighbors by SNMP'
      name: 'NT LLDP Neighbors by SNMP'
      description: |
        Discovers LLDP (and optionally Cisco CDP) neighbours over SNMP for the
        "Network Topology for Zabbix" frontend module. The module draws the links
        (edges) from the neighbour system names - see LLDP-SETUP.md for details.

        Usage:
          - link it to SNMP-capable switches/routers/firewalls
          - enable LLDP on the device (Cisco: CDP is usually on by default)
          - mind the naming: the advertised SysName has to resolve to a
            monitored Zabbix host, otherwise no edge appears (see the LLDP-Q tab).

        Standards-based (IEEE 802.1AB LLDP-MIB); no external collector needed.
      groups:
        - name: Templates/Network devices
      macros:
        - macro: '{$NT.LLDP.INTERVAL}'
          value: 1h
          description: 'Polling interval of the LLDP/CDP neighbour items.'
        - macro: '{$NT.LLDP.DISCOVERY.INTERVAL}'
          value: 3h
          description: 'DEPRECATED since the walk[] rework: LLDP discovery is now a dependent rule on the walk item and follows {$NT.LLDP.INTERVAL}. Only still used by the (Cisco) CDP discovery.'
      items:
        - uuid: 084b4a88188c4714abbd5055588aa4ac
          name: 'LLDP: remote systems table (SNMP walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.0.8802.1.1.2.1.4.1.1.5,1.0.8802.1.1.2.1.4.1.1.7,1.0.8802.1.1.2.1.4.1.1.8,1.0.8802.1.1.2.1.4.1.1.9,1.0.8802.1.1.2.1.4.1.1.10,1.0.8802.1.1.2.1.4.1.1.12]'
          key: nt.lldp.walk
          delay: '{$NT.LLDP.INTERVAL}'
          history: '0'
          value_type: TEXT
          description: |
            One bulk walk over the six needed columns of lldpRemTable
            (LLDP-MIB, 1.0.8802.1.1.2.1.4.1.1): ChassisId (.5), PortId (.7),
            PortDesc (.8), SysName (.9), SysDesc (.10), SysCapEnabled (.12).

            WHY A WALK INSTEAD OF PER-INSTANCE GETs: The SNMP index of
            lldpRemTable is lldpRemTimeMark.lldpRemLocalPortNum.lldpRemIndex.
            TimeMark is an RMON-2 TimeFilter - on several implementations
            (FortiGate: new value on every received PDU; MikroTik RouterOS:
            exact GETs return noSuchObject, only walks work) instance-exact
            GETs on this table are unreliable. A walk sidesteps both:
            discovery and item prototypes hang off this item as DEPENDENT
            and parse the walk text - not a single instance-exact GET left.
      discovery_rules:
        - uuid: f388b88ad77144c7b94dfd9c1913713a
          name: 'LLDP neighbor discovery'
          type: DEPENDENT
          key: nt.lldp.rem.discovery
          delay: '0'
          master_item:
            key: nt.lldp.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#NT_SYSNAME}'
                - 1.0.8802.1.1.2.1.4.1.1.9
                - '0'
                - '{#NT_CHASSIS}'
                - 1.0.8802.1.1.2.1.4.1.1.5
                - '0'
                - '{#NT_REMPORT}'
                - 1.0.8802.1.1.2.1.4.1.1.7
                - '0'
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  // lldpRemTable index = TimeMark.LocalPort.RemIndex. BOTH TimeMark
                  // and RemIndex can be volatile: TimeMark bumps per PDU (FortiGate),
                  // and on some switches (Cisco SG200) RemIndex changes on every LLDP
                  // aging/relearn even though the neighbor and local port are the same.
                  // If RemIndex sits in the LLD identity, each relearn looks like a new
                  // neighbor and the dependent items get recreated (GitHub #25, mmajer).
                  //
                  // Installed-key compatibility: {#SNMPINDEX} is the persistent identity.
                  // LocalPort + installed FNV hash for one port per chassis. It
                  // stays a 3-part NUMERIC index (0.Port.<hash>) so the module still
                  // reads the local port from the middle and correlates the six columns
                  // by it. RemIndex is kept only as {#NT_REMIDX}: the prototype regexes
                  // use it to grab the value from the CURRENT walk, and when it changes
                  // LLD re-syncs that macro on the next poll while the item (its key)
                  // stays put. If a neighbor advertises neither Chassis nor PortId, the
                  // identity uses the installed Port-ID/SysName fallbacks, then RemIndex.
                  //
                  // MISSING TIMEMARK: TP-Link JetStream omits it and returns a 2-part
                  // index (25.1 instead of 1234.25.1). A missing TimeMark counts as 0.
                  // Both this script and the six prototype regexes tolerate that - fix
                  // from issue #15 (lechu2375); DISCARD_VALUE hides the drop otherwise.
                  //
                  // SEEN GUARD: a relearn can leave a stale AND a fresh row in one walk
                  // (or TimeFilter returns the row under two TimeMarks). Deduplicated
                  // per stable {#SNMPINDEX}, choosing the highest TimeMark and
                  // breaking equal-TimeMark ties with the highest RemIndex.
                  function nbrHash(s) {
                      var h = 2166136261;              // FNV-1a, 32-bit, Duktape-safe
                      for (var k = 0; k < s.length; k++) {
                          h ^= s.charCodeAt(k);
                          h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
                      }
                      return (h >>> 0).toString();
                  }
                  // Compatibility: hash and normalize exactly as the installed
                  // 2026-11-10 Zabbix export. Keep {#SNMPINDEX} as the item key.
                  function norm(v) {
                      if (v === null || v === undefined) return '';
                      return String(v).replace(/^\s+|\s+$/g, '')
                          .toLowerCase().replace(/\s+/g, ' ');
                  }
                  var rows = JSON.parse(value), staged = [], groups = Object.create(null);
                  for (var i = 0; i < rows.length; i++) {
                      var r = rows[i];
                      var m = /^(?:(\d+)\.)?(\d+)\.(\d+)$/.exec(r['{#SNMPINDEX}'] || '');
                      if (!m) continue;
                      var localPort = m[2], remIdx = m[3];
                      var chassis = norm(r['{#NT_CHASSIS}']);
                      var remotePort = norm(r['{#NT_REMPORT}']);
                      var sysName = norm(r['{#NT_SYSNAME}']);
                      var identity = chassis ? 'chassis=' + chassis
                          : remotePort ? 'port=' + remotePort + '|name=' + sysName
                          : sysName ? 'name=' + sysName : 'rem=' + remIdx;
                      var group = localPort + '|' + identity;
                      if (chassis) {
                          if (!Object.prototype.hasOwnProperty.call(groups, group)) {
                              groups[group] = Object.create(null);
                          }
                          // Capture the full set of distinct advertised Port-IDs.
                          groups[group][remotePort] = true;
                      }
                      staged.push({row: r, localPort: localPort, remIdx: remIdx,
                          tm: m[1] === undefined ? 0 : parseInt(m[1], 10),
                          chassis: chassis, remotePort: remotePort,
                          identity: identity, group: group});
                  }
                  var best = Object.create(null), order = [];
                  for (var i = 0; i < staged.length; i++) {
                      var s = staged[i];
                      var identity = s.identity;
                      if (s.chassis) {
                          var ports = Object.keys(groups[s.group]).sort();
                          if (ports.length > 1) {
                              // Ambiguous chassis with multiple remote Port-IDs:
                              // every logical observation gets its own identity.
                              // Never reassign the installed chassis-only item key
                              // to whichever Port-ID sorts first. The old aggregate
                              // LLD item may become lost on this transition, which
                              // must be reviewed as an explicit migration.
                              identity += '|port=' + s.remotePort;
                          }
                      }
                      var idx = '0.' + s.localPort + '.' +
                          nbrHash(s.localPort + '|' + identity);
                      // Preserve the installed prototype keys and frontend index.
                      s.row['{#SNMPINDEX}'] = idx;
                      s.row['{#NT_NBR}'] = idx; // compatibility alias for tests
                      s.row['{#NT_PORT}'] = s.localPort;
                      s.row['{#NT_REMIDX}'] = s.remIdx;
                      if (Object.prototype.hasOwnProperty.call(best, idx) &&
                          best[idx].identity !== identity) {
                          throw 'LLDP StableId collision: discovery blocked';
                      }
                      if (!Object.prototype.hasOwnProperty.call(best, idx)) {
                          order.push(idx);
                          best[idx] = {tm: s.tm, rem: parseInt(s.remIdx, 10),
                                       identity: identity, row: s.row};
                      }
                      else if (s.tm > best[idx].tm ||
                          (s.tm === best[idx].tm &&
                              parseInt(s.remIdx, 10) > best[idx].rem)) {
                          best[idx] = {tm: s.tm, rem: parseInt(s.remIdx, 10),
                                       identity: identity, row: s.row};
                      }
                  }
                  var out = [];
                  for (var j = 0; j < order.length; j++) {
                      out.push(best[order[j]].row);
                  }
                  return JSON.stringify(out);
          description: |
            LLDP-MIB lldpRemSysName (1.0.8802.1.1.2.1.4.1.1.9). The {#SNMPINDEX}
            retains the installed 0.LocalPort.StableId identity (Chassis-ID first,
            with Port-ID/SysName fallbacks). Multiple remote Port-ID advertisements
            use port-specific identities to avoid reassigning the chassis-only item key.
            Current raw port/RemIndex are in {#NT_PORT}/{#NT_REMIDX}.
            Over the same raw index the discovery also fetches:

              .7  lldpRemPortId       remote port (fallback)
              .8  lldpRemPortDesc     remote port, readable -> port-to-port labels
              .10 lldpRemSysDesc      vendor/model in plain text
              .12 lldpRemSysCapEnabled  bridge / router / AP / phone
              .5  lldpRemChassisId    base MAC, stable identity

            The last three pay off mainly for UNMONITORED neighbours: without
            them the module knows nothing but their name.
          item_prototypes:
            - uuid: 71e0268303f9471796f291808b05293b
              name: 'LLDP neighbor [{#SNMPINDEX}]: {#NT_SYSNAME}'
              type: DEPENDENT
              key: 'lldpRemSysName[{#SNMPINDEX}]'
              value_type: CHAR
              delay: '0'
              master_item:
                key: nt.lldp.walk
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^\.?1\.0\.8802\.1\.1\.2\.1\.4\.1\.1\.9\.(?:\d+\.)?{#NT_PORT}\.{#NT_REMIDX} = [A-Za-z0-9-]+: "?(.*?)"?$'
                    - '\1'
                  error_handler: DISCARD_VALUE
              history: 7d
              trends: '0'
              description: |
                SysName of the LLDP neighbour seen on the local port. The Network
                Topology module draws it as an edge when the name resolves to a
                monitored Zabbix host.
            - uuid: 33e111c96b2e4ab4a5e0047ba739d05f
              name: 'LLDP neighbor port-id [{#SNMPINDEX}]: {#NT_SYSNAME}'
              type: DEPENDENT
              key: 'lldpRemPortId[{#SNMPINDEX}]'
              value_type: CHAR
              delay: '0'
              master_item:
                key: nt.lldp.walk
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^\.?1\.0\.8802\.1\.1\.2\.1\.4\.1\.1\.7\.(?:\d+\.)?{#NT_PORT}\.{#NT_REMIDX} = [A-Za-z0-9-]+: "?(.*?)"?$'
                    - '\1'
                  error_handler: DISCARD_VALUE
              history: 7d
              trends: '0'
              description: |
                Remote port id of the neighbour (lldpRemPortId, OID ...4.1.1.7).
                Depending on PortIdSubtype this is an interface name ("Gi1/0/8") OR
                a MAC address - which is why the module prefers lldpRemPortDesc and
                only falls back to this one. Same {#SNMPINDEX} as the SysName, hence
                the same neighbour row (that is how the module correlates them).
            - uuid: 296934a9b576433095c087dbdeb383e6
              name: 'LLDP neighbor port-desc [{#SNMPINDEX}]: {#NT_SYSNAME}'
              type: DEPENDENT
              key: 'lldpRemPortDesc[{#SNMPINDEX}]'
              value_type: CHAR
              delay: '0'
              master_item:
                key: nt.lldp.walk
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^\.?1\.0\.8802\.1\.1\.2\.1\.4\.1\.1\.8\.(?:\d+\.)?{#NT_PORT}\.{#NT_REMIDX} = [A-Za-z0-9-]+: "?(.*?)"?$'
                    - '\1'
                  error_handler: DISCARD_VALUE
              history: 7d
              trends: '0'
              description: |
                Human-readable remote port description (lldpRemPortDesc, OID
                ...4.1.1.8), e.g. "nic0" or "GigabitEthernet1/0/8". Preferred source
                for the port-to-port label at the neighbour's end.
            - uuid: ae103ab500594d00bc368f47749fac2e
              name: 'LLDP neighbor sys-desc [{#SNMPINDEX}]: {#NT_SYSNAME}'
              type: DEPENDENT
              key: 'lldpRemSysDesc[{#SNMPINDEX}]'
              value_type: CHAR
              delay: '0'
              master_item:
                key: nt.lldp.walk
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^\.?1\.0\.8802\.1\.1\.2\.1\.4\.1\.1\.10\.(?:\d+\.)?{#NT_PORT}\.{#NT_REMIDX} = [A-Za-z0-9-]+: "?(.*?)"?$'
                    - '\1'
                  error_handler: DISCARD_VALUE
              history: 7d
              trends: '0'
              description: |
                System description of the neighbour (lldpRemSysDesc, OID ...4.1.1.10)
                - usually vendor, model and firmware in plain text, e.g.
                "Cisco IOS Software, C2960X Software ...".

                For MONITORED neighbours this is decoration. It earns its keep on the
                UNMONITORED ones: there the module knows nothing but the name. With
                the description, "something called sw-edge-03 is attached" turns into
                "a Cisco switch is attached" - and thus a hint which template fits.
            - uuid: 36a88ecbea114b5e89f55f7aa684f43d
              name: 'LLDP neighbor capabilities [{#SNMPINDEX}]: {#NT_SYSNAME}'
              type: DEPENDENT
              key: 'lldpRemSysCapEnabled[{#SNMPINDEX}]'
              value_type: CHAR
              delay: '0'
              master_item:
                key: nt.lldp.walk
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^\.?1\.0\.8802\.1\.1\.2\.1\.4\.1\.1\.12\.(?:\d+\.)?{#NT_PORT}\.{#NT_REMIDX} = [A-Za-z0-9-]+: "?(.*?)"?$'
                    - '\1'
                  error_handler: DISCARD_VALUE
              history: 7d
              trends: '0'
              description: |
                Enabled capabilities of the neighbour (lldpRemSysCapEnabled, OID
                ...4.1.1.12) as a bitmask: repeater, bridge, WLAN AP, router,
                phone, DOCSIS, station.

                Says WHAT is attached without having to interpret the name - an
                access point, a phone and a switch look identical otherwise. The
                module picks the icon for unmonitored devices from this instead of
                using the generic placeholder.
            - uuid: e62a93c7791f47aa8f49bb21e7da9136
              name: 'LLDP neighbor chassis-id [{#SNMPINDEX}]: {#NT_SYSNAME}'
              type: DEPENDENT
              key: 'lldpRemChassisId[{#SNMPINDEX}]'
              value_type: CHAR
              delay: '0'
              master_item:
                key: nt.lldp.walk
              preprocessing:
                - type: REGEX
                  parameters:
                    - '(?m)^\.?1\.0\.8802\.1\.1\.2\.1\.4\.1\.1\.5\.(?:\d+\.)?{#NT_PORT}\.{#NT_REMIDX} = [A-Za-z0-9-]+: "?(.*?)"?$'
                    - '\1'
                  error_handler: DISCARD_VALUE
              history: 7d
              trends: '0'
              description: |
                Chassis id of the neighbour (lldpRemChassisId, OID ...4.1.1.5),
                depending on the subtype usually the device's base MAC.

                This is the only STABLE identifier LLDP provides about an
                unmonitored neighbour. Deduplication today happens over the system
                name: the same device, reported by three switches, is merged by its
                name - rename it and it shows up as a new device. Over the chassis
                id the identity survives.
        - uuid: 8e6fb294701f48d3a41dd38e59d1fbf0
          name: 'CDP neighbor discovery (Cisco)'
          type: SNMP_AGENT
          key: nt.cdp.cache.discovery
          snmp_oid: 'discovery[{#NT_DEVICEID},1.3.6.1.4.1.9.9.23.1.2.1.1.6]'
          delay: '{$NT.LLDP.DISCOVERY.INTERVAL}'
          description: |
            CISCO-CDP-MIB cdpCacheDeviceId (1.3.6.1.4.1.9.9.23.1.2.1.1.6). For
            Cisco devices that speak CDP instead of, or in addition to, LLDP. On
            non-Cisco devices this discovery simply stays empty (not an error).
          item_prototypes:
            - uuid: 7f0e08dfeb4e41a1b9286aa4f26a9e49
              name: 'CDP neighbor [{#SNMPINDEX}]: {#NT_DEVICEID}'
              type: SNMP_AGENT
              key: 'cdpCacheDeviceId[{#SNMPINDEX}]'
              snmp_oid: '1.3.6.1.4.1.9.9.23.1.2.1.1.6.{#SNMPINDEX}'
              value_type: CHAR
              delay: '{$NT.LLDP.INTERVAL}'
              history: 7d
              trends: '0'
              description: |
                Device id of the CDP neighbour (Cisco). Treated by the module like
                an LLDP neighbour (the key contains cdpCacheDeviceId).
            - uuid: d23195fc34e14ebe9a1f0b1c0590221c
              name: 'CDP neighbor port [{#SNMPINDEX}]: {#NT_DEVICEID}'
              type: SNMP_AGENT
              key: 'cdpCacheDevicePort[{#SNMPINDEX}]'
              snmp_oid: '1.3.6.1.4.1.9.9.23.1.2.1.1.7.{#SNMPINDEX}'
              value_type: CHAR
              delay: '{$NT.LLDP.INTERVAL}'
              history: 7d
              trends: '0'
              description: |
                Remote port of the CDP neighbour (cdpCacheDevicePort, OID
                ...23.1.2.1.1.7), e.g. "GigabitEthernet0/1". Same {#SNMPINDEX} as
                cdpCacheDeviceId, hence the same neighbour row.