zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates/Network devices
  templates:
    - uuid: 8a2078a416c0484cb6c8ca9052e51601
      template: 'NT LLDP Local Ports by SNMP'
      name: 'NT LLDP Local Ports by SNMP'
      description: |
        Optional local LLDP port identity walks for Network Topology.
        Link only to supported SNMP switches during an approved pilot.
        Requires nt.fdb.ifname plus fresh scoped FDB/ARP evidence.
        The LLDP Port-ID reconciler remains OFF by default in PHP.
        This template does not establish confirmed physical cables.
      groups:
        - name: Templates/Network devices
      macros:
        - macro: '{$NT.LLDP.LOCAL.INTERVAL}'
          value: 30m
          description: 'Polling interval for local LLDP port tables.'
      items:
        - uuid: 2397610748ce47acb897ec701c6eb860
          name: 'NT LLDP local port IDs'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.0.8802.1.1.2.1.3.7.1.3]'
          key: nt.lldp.local.portid
          delay: '{$NT.LLDP.LOCAL.INTERVAL}'
          history: 1d
          trends: '0'
          value_type: TEXT
          description: |
            Raw lldpLocPortId walk, indexed by lldpLocPortNum.
            Used for explicit local-port mapping, never as ifIndex.
        - uuid: c961682b39544e7cbbd8a4fa612844f0
          name: 'NT LLDP local port descriptions'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.0.8802.1.1.2.1.3.7.1.4]'
          key: nt.lldp.local.portdesc
          delay: '{$NT.LLDP.LOCAL.INTERVAL}'
          history: 1d
          trends: '0'
          value_type: TEXT
          description: |
            Raw lldpLocPortDesc walk, indexed by lldpLocPortNum.
            Optional readable fallback for local IF-MIB mapping.
